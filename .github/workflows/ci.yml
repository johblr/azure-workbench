name: CI

on:
  push:
  pull_request:

# Read-only by default; jobs that publish request more explicitly.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AzureWorkbench.slnx -c Release

      - name: Run checks
        run: dotnet run --project tests/AzureWorkbench.Checks -c Release

  # Optional: macOS runners may be unavailable, so this job can never fail or block the workflow.
  build-macos:
    name: Build and check (macos-latest, optional)
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build AzureWorkbench.slnx -c Release

      - name: Run checks
        run: dotnet run --project tests/AzureWorkbench.Checks -c Release
